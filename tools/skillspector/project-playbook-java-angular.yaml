# Justified SkillSpector suppressions for skills/project-playbook-java-angular (see README, section Sécurité).
version: 2
rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "scripts/project_scan.py (partial)"
    reason: "--no-llm only: the deterministic layer stops on dense detection regexes (obfuscated_instruction_text / static_parse_limit), the rest of the file is scanned. First-party code under review and regression tests; run a full LLM scan before a release."
  - id: "AE1"
    path: "SKILL.md"
    message: "scripts/confluence_export.py (partial)"
    reason: "--no-llm only: the deterministic layer stops on dense detection regexes (obfuscated_instruction_text / static_parse_limit), the rest of the file is scanned. First-party code under review and regression tests; run a full LLM scan before a release."
  - id: "AE1"
    path: "SKILL.md"
    message: "page-templates.md (partial)"
    reason: "--no-llm only: a long Markdown template table exceeds the static parser span. First-party template; run a full LLM scan before a release."
  - id: "LP3"
    path: "SKILL.md"
    reason: "Bob Shell does not read allowed-tools/permissions from the front matter: tool access comes from the Bob mode and its approvals. The scripts only read the analysed repositories (tools/test_security.py)."
  - id: "AST4"
    path: "scripts/project_scan.py"
    message: "*SAFE_GIT*"
    reason: "Read-only git queries through SAFE_GIT: argument list without a shell, core.fsmonitor and hooks disabled by command-line overrides, no optional index lock (tools/test_security.py)."
  - id: "PE3"
    path: "scripts/project_scan.py"
    message: ".env\""
    reason: "Extension of configuration files to map; secret-like values are never printed, only their location."
