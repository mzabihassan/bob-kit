# Justified SkillSpector suppressions for skills/design-system (see README, section Sécurité).
version: 2
rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "scripts/extract_design_tokens.py (partial)"
    reason: "--no-llm only: the deterministic layer stops on dense detection regexes (obfuscated_instruction_text / static_parse_limit), the rest of the file is scanned. First-party code under review and regression tests; run a full LLM scan before a release."
  - id: "LP3"
    path: "SKILL.md"
    reason: "Bob Shell does not read allowed-tools/permissions from the front matter: tool access comes from the Bob mode and its approvals. The scripts only read the analysed repositories (tools/test_security.py)."
