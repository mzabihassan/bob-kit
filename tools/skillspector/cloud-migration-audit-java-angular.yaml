# Justified SkillSpector suppressions for skills/cloud-migration-audit-java-angular (see README, section Sécurité).
# Most matches are the audit's own controls and detection patterns: the skill looks for these weaknesses
# in the audited repositories, it never applies them.
version: 2
rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "scripts/discover.py (partial)"
    reason: "--no-llm only: the deterministic layer stops on dense detection regexes (obfuscated_instruction_text / static_parse_limit), the rest of the file is scanned. First-party code under review and regression tests; run a full LLM scan before a release."
  - id: "AE1"
    path: "SKILL.md"
    message: "scripts/render.py (partial)"
    reason: "--no-llm only: the deterministic layer stops on dense detection regexes (obfuscated_instruction_text / static_parse_limit), the rest of the file is scanned. First-party code under review and regression tests; run a full LLM scan before a release."
  - id: "LP3"
    path: "SKILL.md"
    reason: "Bob Shell does not read allowed-tools/permissions from the front matter: tool access comes from the Bob mode and its approvals. The scripts only read the analysed repositories (tools/test_security.py)."
  - id: "AST4"
    path: "scripts/discover.py"
    message: "*SAFE_GIT*"
    reason: "Read-only git queries through SAFE_GIT: argument list without a shell, core.fsmonitor and hooks disabled by command-line overrides, no optional index lock (tools/test_security.py)."
  - id: "PE3"
    path: "audit-platform.md"
    message: ".npmrc"
    reason: "Control CTR-04: flags .npmrc/settings.xml copied into an image; the agent reports the file, never its content."
  - id: "PE3"
    path: "scripts/catalog.py"
    message: ".npmrc"
    reason: "Text of control CTR-04 (no credential files baked into images)."
  - id: "PE3"
    path: "scripts/discover.py"
    message: ".npmrc"
    reason: "Detection regex for credential files copied by a Dockerfile; matched lines are masked before output."
  - id: "PE3"
    path: "scripts/discover.py"
    message: ".env\""
    reason: "Extension of configuration files to scan; secret-like values are masked (mask()) and never printed."
  - id: "PE3"
    path: "scripts/discover.py"
    message: "access token"
    reason: "Label of the token-shape regex used to detect leaked secrets; the value is masked in the inventory."
  - id: "TM4"
    path: "scripts/discover.py"
    message: "hostPath:"
    reason: "Detection regex for persistent volumes in Kubernetes manifests (control K8S storage)."
  - id: "TM3"
    path: "scripts/catalog.py"
    message: "world-writable"
    reason: "Text of control CTR-09: no world-writable files in the image."
  - id: "SC2"
    path: "audit-platform.md"
    message: "curl*sh"
    reason: "Control CTR-08: flags curl | sh in Dockerfiles; not a command the skill runs."
  - id: "TM1"
    path: "audit-platform.md"
    message: "chmod 777"
    reason: "Control CTR-09: flags chmod 777 in Dockerfiles."
  - id: "PE2"
    path: "audit-platform.md"
    message: "chmod 777"
    reason: "Control CTR-09: flags chmod 777 in Dockerfiles."
  - id: "PE2"
    path: "audit-platform.md"
    message: "run as root"
    reason: "Control CTR-03: flags base images that run as root by default."
