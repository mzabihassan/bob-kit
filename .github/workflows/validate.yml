name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pyyaml
      - name: Validate skills, modes and hooks
        run: python3 tools/validate_kit.py
      - name: Test hooks
        run: python3 tools/test_hooks.py
