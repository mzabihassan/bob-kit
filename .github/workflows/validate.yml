name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Python 3.9 is the oldest version the kit supports; setup-python only ships it up to Ubuntu 24.04
    # (ubuntu-latest moved to 26.04 in October 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pyyaml
      - name: Validate skills, modes and hooks
        run: python3 tools/validate_kit.py
      - name: Test hooks
        run: python3 tools/test_hooks.py
      - name: Test the cloud migration audit engine
        run: python3 tools/test_cloud_audit.py
      - name: Test the scripts and hooks against hostile repositories
        run: python3 tools/test_security.py

  skillspector:
    # Static scan of every skill (no LLM, nothing leaves the runner); fails on any finding
    # that tools/skillspector/<skill>.yaml does not justify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SkillSpector v2.13.0 (pinned commit)
        run: pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector@091a509b3d6ba8ff5be528966e1f43c2e68cf214"
      - name: Scan the skills
        run: python3 tools/scan_skills.py --out skillspector-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-reports
          path: skillspector-reports/
